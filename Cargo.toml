[workspace]
resolver = "2"
members = [
    "banc",
    "banc-icd",
    "banc-host",
    "banc-probe",
    "banc-instrument",
]
# Firmware builds for thumbv8m.main-none-eabihf with its own profile; keep it
# out of host `cargo build`/`cargo test` at the workspace root.
exclude = ["banc-assistant"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Louis Thiery <thiery.louis@gmail.com>"]
repository = "https://github.com/lthiery/banc"
keywords = ["hil", "testing", "embedded", "hardware"]
categories = ["development-tools::testing", "embedded"]

[workspace.dependencies]
banc-icd = { path = "banc-icd", version = "0.0.1" }
banc-host = { path = "banc-host", version = "0.0.2" }
banc-probe = { path = "banc-probe", version = "0.0.1" }
banc-instrument = { path = "banc-instrument", version = "0.0.1" }

postcard-rpc = "0.12"
postcard-schema = { version = "0.2", default-features = false, features = ["derive", "heapless-v0_8"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "macros", "fs", "io-util"] }
thiserror = "2"
anyhow = "1"
