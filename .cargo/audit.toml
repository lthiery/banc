# cargo-audit configuration (read by `cargo audit` only; does not affect builds).
#
# These are "unmaintained" advisories, not vulnerabilities, for crates pulled
# in transitively by dependencies we do not control. We cannot drop them by
# upgrading our own code; they clear when the upstreams below move off them.
# Revisit on any probe-rs / postcard-rpc bump.
[advisories]
ignore = [
    # atomic-polyfill 1.0.3 <- heapless 0.7 <- postcard 1.1 <- postcard-rpc 0.12.
    # heapless 0.8 already dropped atomic-polyfill; clears when postcard moves
    # its heapless dependency to 0.8.
    "RUSTSEC-2023-0089",
    # bincode 2.0.1 <- probe-rs 0.32. Clears when probe-rs drops or replaces
    # bincode.
    "RUSTSEC-2025-0141",
]
