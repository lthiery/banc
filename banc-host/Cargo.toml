[package]
name = "banc-host"
description = "Host-side fixtures and test runner for the banc HIL test framework: rig topology, hardware serialization, self-skip, evidence"
version = "0.0.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
banc-icd = { workspace = true }
postcard-rpc = { workspace = true, features = ["use-std", "raw-nusb"] }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
libtest-mimic = "0.8.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
fs4 = { version = "0.13", features = ["sync"] }

[[test]]
name = "smoke"
harness = false

[[test]]
name = "paired"
harness = false
